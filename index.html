  </head>
  <body>
    <div id="root"></div>

    <!-- Facebook JavaScript SDK -->
    <script>
      window.fbAsyncInit = function() {
        var fbAppId = '{your-app-id}';
        var fbVersion = '{api-version}';

        // Só inicializa quando o App ID real for configurado, evitando a exceção "invalid version specified"
        if (fbAppId && fbAppId !== '{your-app-id}' && !fbAppId.includes('{')) {
          try {
            var validVersion = (fbVersion && fbVersion !== '{api-version}' && !fbVersion.includes('{')) ? fbVersion : 'v20.0';
            FB.init({
              appId      : fbAppId,
              cookie     : true,
              xfbml      : true,
              version    : validVersion.startsWith('v') ? validVersion : 'v' + validVersion
            });
              
            FB.AppEvents.logPageView();   
          } catch (e) {
            console.warn('Aviso ao inicializar Facebook SDK:', e);
          }
        }
      };

      (function(d, s, id){
         var js, fjs = d.getElementsByTagName(s)[0];
         if (d.getElementById(id)) {return;}
         js = d.createElement(s); js.id = id;
         js.src = "https://connect.facebook.net/en_US/sdk.js";
         fjs.parentNode.insertBefore(js, fjs);
       }(document, 'script', 'facebook-jssdk'));
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
